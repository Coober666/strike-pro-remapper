name: CI

on:
  push:
  pull_request:

jobs:
  windows-host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Host lifecycle and recovery
        run: python tools/test_host_launcher.py
      - name: Real Tk controls with a disposable library
        env:
          STRIKE_REQUIRE_TK: '1'
        run: python tools/test_host_window.py

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile check
        run: python -m compileall -q strike_remap.py launch_editor.py strike_remapper

      - name: Generate synthetic fixtures
        run: python tools/make_fixtures.py

      - name: Kit round-trip (parse → build is lossless)
        run: python tools/test_roundtrip.py tests/fixtures/*.skt

      - name: Instrument round-trip (parse/patch preserve bytes)
        run: python tools/test_sin_roundtrip.py tests/fixtures/*.sin

      - name: Dump Python parser output (expected)
        run: python tools/dump_parser_expected.py

      - name: JS↔Python parser parity (web viewer stage 1)
        run: node web/test_parsers.mjs

      - name: Dump Python similarity k-NN output (expected)
        run: python tools/dump_similar_expected.py

      - name: JS↔Python similarity k-NN parity
        run: node web/test_similar.mjs

      - name: Viewer extraction in sync with embedded UI
        run: python tools/extract_viewer.py --check

      - name: Single-file viewer bundle (build + validate)
        run: python tools/build_viewer.py --check

      # Every no-arg tools/test_*.py runs automatically — new test files need no
      # registration here. Only the two fixture-arg round-trip tests (invoked
      # explicitly above) are skipped.
      - name: All regression tests (auto-discovered)
        run: |
          set -e
          found=0
          for t in tools/test_*.py; do
            case "$t" in
              tools/test_roundtrip.py|tools/test_sin_roundtrip.py) continue ;;
            esac
            found=1
            echo "=== $t"
            python "$t"
          done
          test "$found" -eq 1  # glob must match — an empty tools/ is a failure

      - name: Embedded JS syntax check
        run: |
          python tools/extract_embedded_js.py
          node --check .build/embedded.js

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install pinned JS tooling
        run: npm ci

      - name: Portable Python resolver contracts
        run: npm run test:python

      - name: MIDI session analysis contracts
        run: npm run test:midi

      - name: Lint embedded editor JavaScript
        run: npm run lint:js

      - name: Install pinned Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Browser workflows
        run: npm run test:browser

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: test-results/
          if-no-files-found: ignore

  source-beta:
    needs: [windows-host, test, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build verified source beta
        run: python tools/build_beta.py --output "${{ runner.temp }}/strike-remapper-${{ github.sha }}.zip" --require-clean
      - uses: actions/upload-artifact@v4
        with:
          name: strike-source-beta-${{ github.sha }}
          path: |
            ${{ runner.temp }}/strike-remapper-*.zip
            ${{ runner.temp }}/strike-remapper-*.sha256.txt
          if-no-files-found: error
          retention-days: 30

  windows-beta:
    needs: [windows-host, test, browser]
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install pinned packaging tools and MIDI
        run: python -m pip install -r requirements-build-windows.txt
      - name: Build standalone Windows beta
        run: python tools/build_windows.py --output "${{ runner.temp }}/strike-remapper-windows-x64-${{ github.sha }}.zip" --require-clean
      - name: Check extracted bundled runtime without Python on PATH
        run: python tools/check_windows_package.py "${{ runner.temp }}/strike-remapper-windows-x64-${{ github.sha }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: strike-windows-beta-${{ github.sha }}
          path: |
            ${{ runner.temp }}/strike-remapper-windows-x64-*.zip
            ${{ runner.temp }}/strike-remapper-windows-x64-*.sha256.txt
          if-no-files-found: error
          retention-days: 30
